<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Kitchen AR Viewer</title>

    <script type="module"
      src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.0.1/model-viewer.min.js">
    </script>

</head>

<body>

<h1>View in AR</h1>

<model-viewer id="viewer"
    ar
    camera-controls
    auto-rotate
    style="width: 100%; height: 600px;">
</model-viewer>

<script>
const params = new URLSearchParams(window.location.search);
const modelPath = params.get("model");

document.getElementById("viewer").src = modelPath;
</script>

</body>
</html>
