<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>L-Shape Kitchens</title>

    <link rel="stylesheet" href="assets/styles/style.css">
    
    <style>
        .gallery {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            padding: 20px;
        }
        .thumb {
            width: 250px;
            cursor: pointer;
            text-align: center;
        }
        .thumb img {
            width: 100%;
            border-radius: 10px;
            box-shadow: 0 0 10px #ccc;
        }
        h1 {
            padding-left: 20px;
        }
    </style>
</head>

<body>

<h1>Select Your L-Shape Kitchen</h1>

<div class="gallery">

    <!-- MODEL 1 -->
    <div class="thumb" onclick="openAR('assets/models/p.glb')">
        <img src="assets/thumbnails/lshape/p1.jpeg">
        <p>Design 1</p>
    </div>

    <!-- MODEL 2 -->
    <div class="thumb" onclick="openAR('assets/models/product2.glb')">
        <img src="assets/thumbnails/lshape/p2.jpeg">
        <p>Design 2</p>
    </div>

</div>

<script>
function openAR(model) {
    window.location.href = "ar.html?model=" + encodeURIComponent(model);
}
</script>

</body>
</html>
